# Servidor
server.port=8080

# Conexión a Base de Datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/crm_ecommerce_saas
spring.datasource.username=postgres
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (Validación de esquema; Flyway gestiona el DDL)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway (Motor de migraciones versionadas)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Microservicio FastAPI (Módulo de Analítica y Reportes)
fastapi.service.url=http://localhost:8000

# JWT (JSON Web Token)
# IMPORTANTE: Cambiar este secreto en producción por una variable de entorno segura.
# La clave debe tener al menos 256 bits (32 caracteres ASCII) para HMAC-SHA256.
jwt.secret=S4a5sC0reS3cr3tK3y!Pr0ductionR3pl4c3M3W1thEnvV4r!2024
# Tiempo de expiración del token: 86400000 ms = 24 horas
jwt.expiration-ms=86400000